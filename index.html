<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c1017" />
    <meta
      name="description"
      content="Ivan Lapshev — React Native / Frontend Engineer CV"
    />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <title id="page-title">Ivan Lapshev · CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/resume.css" />
  </head>
  <body>
    <div class="page">
      <div class="atmosphere" aria-hidden="true">
        <canvas id="bg-canvas" class="bg-canvas"></canvas>
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
      </div>

      <div class="shell">
        <div class="toolbar" role="toolbar" aria-label="Resume controls">
          <label class="switch" for="lang-switch">
            <span class="switch-side" data-side="left">ENG</span>
            <input id="lang-switch" type="checkbox" role="switch" aria-label="Language" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span class="switch-side" data-side="right">RUS</span>
          </label>

          <label class="switch" for="theme-switch">
            <span class="switch-side" data-side="left">DARK</span>
            <input id="theme-switch" type="checkbox" role="switch" aria-label="Theme" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span class="switch-side" data-side="right">LIGHT</span>
          </label>

          <button class="tool" id="export-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 3h7v7" />
              <path d="M10 14 21 3" />
              <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
            </svg>
            <span class="tool-label">PDF</span>
          </button>
        </div>

        <main class="resume" id="resume">
          <aside class="sidebar">
            <div class="profile">
              <div class="avatar-wrap">
                <div class="avatar-ring" aria-hidden="true"></div>
                <img class="avatar" src="/my-image-5.webp" alt="Ivan Lapshev" width="168" height="168" />
              </div>
              <h1 class="name" id="name">Ivan Lapshev</h1>
              <p class="role" id="role">React Native · Frontend Engineer</p>
              <div class="badge">
                <span class="badge-dot" aria-hidden="true"></span>
                <span id="available">Open to new projects</span>
              </div>
            </div>

            <section class="side-block">
              <h2 class="section-label" id="contacts-title">Contacts</h2>
              <div class="contacts" id="contacts"></div>
            </section>

            <section class="side-block">
              <h2 class="section-label" id="skills-title">Skills</h2>
              <div class="skills" id="skills"></div>
            </section>
          </aside>

          <div class="main">
            <section class="intro">
              <div class="kicker" id="about-title">About me</div>
              <h2 id="intro-headline">Building polished mobile products</h2>
              <p class="about-text" id="about"></p>
            </section>

            <section class="experience">
              <div class="section-head">
                <h2 class="section-title" id="employment-title">Experience</h2>
                <span class="section-note" id="employment-note">5+ years in development</span>
              </div>
              <div class="timeline" id="jobs"></div>
              <p class="footer-note" id="footer">Minsk · React Native · Mobile</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="/assets/js/resume.js"></script>
  </body>
</html>
